[project]
name = "quickbench"
version = "0.1.0"
description = "A fast LLM benchmark (dataset + harness) for comparing local models, fine-tunes and quantizations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quickbench = "quickbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quickbench"]
