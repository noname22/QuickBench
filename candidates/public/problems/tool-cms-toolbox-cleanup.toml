def resolves(s, slug, depth=0):
    if depth > 6:
        return False
    pid = by_slug(s, slug)
    if pid is None:
        target = s["redirects"].get(slug)
        return target in s["pages"] and resolves(s, s["pages"][target]["slug"], depth + 1)
    page = s["pages"][pid]
    if page["status"] == "published":
        return True
    if page["status"] == "archived" and page["redirect_to"] in s["pages"]:
