JOBS = [('J1', 'black', 'large', 25), ('J2', 'white', 'large', 20), ('J3', 'yellow', 'large', 35), ('J4', 'white', 'small', 60), ('J5', 'yellow', 'small', 50), ('J6', 'red', 'small', 40), ('J7', 'red', 'large', 50), ('J8', 'black', 'small', 45)]

