# sources: Wikipedia, Tupac Amaru (beheaded at Cusco on 24 September 1572 under Viceroy Francisco de Toledo); a peer-reviewed article on Redalyc ('la ejecucion de Tupac Amaru por orden del virrey Francisco de Toledo'), with an H-Net academic review confirming Toledo ordered the Vilcabamba campaign
