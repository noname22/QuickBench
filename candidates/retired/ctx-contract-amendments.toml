23.2 Exit assistance beyond the return of Customer Data is charged at the rates in Schedule 1 and is provided for up to ninety days after termination, extendable by agreement.
23.3 The Supplier shall return Customer Data in a documented, machine-readable format and shall delete its remaining copies within sixty days of the end of the exit period, save for copies retained under a legal obligation.

