(A) The Supplier operates a hosted analytics platform and provides related services.
(B) The Customer, a company registered in Norway, wishes to obtain access to the platform and related services for its operations, and the Supplier has agreed to provide them on the terms of this Agreement.

IT IS AGREED AS FOLLOWS:

1. DEFINITIONS AND INTERPRETATION
1.1 In this Agreement the following words have the meanings given: Affiliate means any entity that controls, is controlled by or is under common control with a Party; Business Day means a day other than a Saturday, Sunday or public holiday in Norway; Customer Data means all data provided by or on behalf of the Customer to the Supplier; Platform means the Supplier's hosted analytics platform as described in Schedule 1; Services means the services described in Schedule 1; Scheduled Maintenance has the meaning in Schedule 2.
1.2 Clause headings are for convenience only and do not affect the construction of this Agreement. Expressions in the singular include the plural and vice versa. References to a Clause or Schedule are to a clause of or schedule to this Agreement unless indicated otherwise.
1.3 If there is any conflict between the Clauses and the Schedules, the Clauses prevail; in the event of any conflict between this Agreement and an Order Form, this Agreement prevails unless the Order Form expressly states that it amends a named Clause.

2. APPOINTMENT AND SCOPE
2.1 The Customer appoints the Supplier to provide the Services and the Supplier agrees to provide them in accordance with this Agreement, with reasonable skill and care and in accordance with Good Industry Practice.
2.2 The Supplier may use its Affiliates and subcontractors to perform the Services provided that the Supplier remains responsible for their acts and omissions as if they were its own.
2.3 Nothing in this Agreement obliges the Customer to order any minimum quantity of Services except as specifically set out in Schedule 1.

3. TERM
3.1 This Agreement commences on the Effective Date and, unless terminated earlier in accordance with Clause 14, continues until 2036-03-31 (the Initial Term).
3.2 Upon expiry of the Initial Term this Agreement renews by default for successive periods of twelve months unless either Party gives written notice of non-renewal not less than ninety days before the end of the then-current period.
3.3 The Supplier may adjust the Monthly Fee with effect from the start of each renewal period by not more than the change in the harmonised index of consumer prices published for Norway over the preceding twelve months, by giving notice with the notice of renewal.

4. CUSTOMER OBLIGATIONS
4.1 The Customer shall provide such information, access and cooperation as the Supplier reasonably requires to perform the Services, and shall ensure that the Customer Data is accurate and lawfully obtained.
4.2 The Customer is accountable for the acts and omissions of its Authorised Users and shall keep the access credentials issued to them confidential.
4.3 The Customer shall not, and shall not permit any third party to, reverse engineer, decompile or otherwise attempt to derive the source code of the Platform, except to the extent that restriction is prohibited by applicable law.

5. CHANGE CONTROL
5.1 Either Party may propose a change to the Services by submitting a written change request. The Supplier shall respond within ten Business Days with an impact assessment covering scope, timetable and fees.
5.2 No change is effective unless recorded in a change note signed by both the Parties, or in an amendment to this Agreement executed in accordance with Clause 24.
5.3 Until agreement of a change the Supplier shall continue to perform the Services in accordance with the existing terms.

6. FEES AND PAYMENT
6.1 The Customer shall pay the Supplier a fixed monthly service fee of EUR 18,500 (the Monthly Fee) for the Services described in Schedule 1, invoiced monthly in advance.
6.2 Professional services are charged at the rates in Schedule 1 and invoiced monthly in arrears against signed timesheets.
6.3 All fees are stated exclusive of value added tax, which is payable in addition at the applicable rate.
6.4 Each invoice is payable within 30 days of the invoice date. Interest on overdue amounts accrues at eight percentage points above the reference rate of the European Central Bank.
6.5 The Customer may withhold payment of an invoice in good faith by notifying the Supplier within ten Business Days of receipt, in which case the undisputed portion remains payable on the due date.

7. INTELLECTUAL PROPERTY
7.1 The Supplier and its licensors keep all intellectual property rights in the Platform, the Services and any materials provided under this Agreement. No rights are transferred to the Customer except the licence in Clause 7.2.
7.2 The Supplier grants the Customer a non-exclusive, non-transferable licence for the Term to access and use the Platform for its internal business purposes through the Authorised Users.
7.3 The Customer retains all rights in the Customer Data and grants the Supplier a licence to process the Customer Data to the extent necessary to provide the Services.

8. CONFIDENTIALITY
8.1 Each Party shall keep the other Party's Confidential Information confidential, use it only for the purposes of this Agreement and disclose it only to those of its employees, Affiliates and advisers who need to know it and are bound by equivalent obligations.
8.2 Clause 8.1 does not apply to information that is or becomes public other than through breach of this Agreement, was lawfully in the recipient's possession before disclosure, or must be disclosed by law or by order of a court or regulator.
8.3 The obligations in this Clause 8 survive five years after termination or expiry.

9. DATA PROTECTION AND HOSTING
9.1 Each Party shall comply with applicable data protection law in relation to Customer Data. The Parties agree that the Customer is the controller and the Supplier the processor of any personal data in the Customer Data, and the Data Processing Schedule applies.
9.2 The Supplier shall implement appropriate technical and organisational measures against unauthorised or unlawful processing and against accidental loss, destruction or damage.
9.3 Customer Data shall be hosted and processed exclusively in data centres located in Denmark, and shall not be transferred outside that country without the Customer's prior written consent.
9.4 The Supplier shall notify the Customer without undue delay, and in any event within forty-eight hours, on becoming aware of a personal data breach affecting Customer Data.

10. SECURITY
10.1 The Supplier shall hold certification of its information security management system to a recognised international standard for the Term and shall provide a copy of the current certificate on request.
10.2 The Customer may, not more than once in any twelve-month period and on thirty days' notice, audit the Supplier's compliance with this Clause 10 during Business Hours and with minimal disruption to the Supplier's operations.

11. WARRANTIES
11.1 The Supplier warrants that the Services will be performed with reasonable skill and care and that the Platform will perform materially in accordance with the Documentation.
11.2 The Customer's sole remedy for breach of Clause 11.1 is that the Supplier shall, at its option, re-perform the affected Services or refund the fees paid for them.
11.3 Except as expressly set out in this Agreement, all warranties, conditions and terms implied by statute or common law are excluded to the fullest extent permitted by law.

12. LIMITATION OF LIABILITY
12.1 Nothing in this Agreement excludes either Party's liability for death or personal injury caused by negligence, for fraud, or for any liability that cannot be limited by law.
12.2 The total aggregate liability of the Supplier under or in connection with this Agreement, whether in contract, tort or otherwise, shall not exceed EUR 500,000 in any contract year.
12.3 Neither Party is liable for loss of profit, loss of business, loss of anticipated savings or any indirect or consequential loss, however arising.

13. INSURANCE
13.1 The Supplier shall maintain professional indemnity insurance with a limit of not less than EUR 2,000,000 per claim and public liability insurance with a limit of not less than EUR 5,000,000 per occurrence for the Term.

14. TERMINATION
14.1 Either Party may terminate this Agreement for convenience by giving the other Party not less than 6 months' written notice, such notice not to expire before the end of the Initial Term.
14.2 Either Party may terminate this Agreement with immediate effect by written notice if the other Party commits a material breach which is not remedied within thirty days of a notice requiring it to do so, or becomes insolvent.
14.3 Upon termination the Supplier shall, on request made within thirty days, return or delete the Customer Data and provide reasonable exit assistance at the rates in Schedule 1 for up to ninety days.

15. FORCE MAJEURE
15.1 Neither Party is liable for a failure or delay in performance caused by events beyond its reasonable control, provided that it notifies the other Party promptly and uses reasonable endeavours to mitigate the effect. If such an event continues for more than sixty days either Party may terminate on written notice.

16. GOVERNANCE AND ESCALATION
16.1 The Parties shall hold a service review meeting each month and a commercial review quarterly, attended by the account manager named in Schedule 4 and the Customer's nominated representative.
16.2 Any dispute is first referred to the Parties' account managers, then within ten Business Days to their respective senior executives, before either Party commences proceedings under Clause 18.

17. ASSIGNMENT AND SUBCONTRACTING
17.1 Neither Party may assign or transfer this Agreement without the other Party's prior written consent, not to be unreasonably withheld, except to an Affiliate or to a successor to all or substantially all of its business.

18. GOVERNING LAW AND JURISDICTION
18.1 This Agreement and any non-contractual obligations arising out of or in connection with it are governed by the laws of Norway.
18.2 The courts of Helsinki have exclusive jurisdiction over any dispute arising out of or in connection with this Agreement, without prejudice to either Party's right to seek interim relief in any competent court.

19. NOTICES
19.1 Notices under this Agreement must be in writing and delivered by hand, by registered post or by email to the addresses in Schedule 4, and are deemed received on delivery, two Business Days after posting, or on the Business Day after sending by email, respectively.

20. ANTI-BRIBERY AND SANCTIONS
20.1 Each Party shall comply with all applicable anti-bribery and anti-corruption laws and shall maintain in place throughout the Term its own policies and procedures to ensure compliance, and shall apply them where appropriate.
20.2 Each Party represents that neither it nor any of its directors is the subject of sanctions administered by the United Nations, the European Union or the United States, and shall notify the other Party without delay if that ceases to be true.
20.3 Breach of this Clause 20 is a material breach that is not capable of remedy for the purposes of Clause 14.2.

21. BUSINESS CONTINUITY
21.1 The Supplier shall maintain a business continuity and disaster recovery plan for the Platform, test it at least once a year and provide the Customer a summary of the test results on request.
21.2 The plan shall provide for a recovery time objective of four hours and a recovery point objective of one hour for the Platform, measured from the Supplier's declaration of a disaster.
21.3 Where the Supplier invokes the plan it shall inform the Customer within two hours and hold the Customer informed of progress at intervals of not more than four hours until the Platform is restored.

22. NON-SOLICITATION
22.1 Neither Party shall, during the Term and for six months after it, directly or indirectly solicit for employment any employee of the other Party who has been materially involved in the Services, without the other Party's written consent. General advertisements not targeted at such employees are not solicitation.
22.2 A Party in breach of Clause 22.1 shall pay the other Party, as liquidated damages, a sum equal to six months' gross salary of the employee concerned, which the Parties agree is a genuine pre-estimate of loss.

23. EXIT ASSISTANCE
