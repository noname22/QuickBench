        "fraud-score": {"version": 5, "values": {"worker_threads": 16}},
        "catalog-cache": {"version": 3, "values": {"max_memory_mb": 2048, "ttl_s": 900}},
    }
    history = {
        "ledger-db-proxy": [
            {"version": 17, "time": "2026-09-21 13:20", "author": "k.osei", "change": "CHG-4471 right-size idle pools",
             "key": "pool_max_connections", "old": 64, "new": 8},
            {"version": 16, "time": "2026-09-20 16:45", "author": "m.brandt", "change": "CHG-4402",
             "key": "idle_timeout_s", "old": 300, "new": 120},
            {"version": 15, "time": "2026-09-16 08:10", "author": "m.brandt", "change": "CHG-4377",
             "key": "pool_max_connections", "old": 48, "new": 64}],
        "payment-svc": [{"version": 22, "time": "2026-09-15 09:45", "author": "deploy-bot", "change": "v5.8.2",
